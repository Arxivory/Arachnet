[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "arachnet-bim-ingestion"
version = "0.1.0"
description = "Wired-only IFC ingestion API for ArachNet"
requires-python = ">=3.11,<3.13"

[tool.setuptools.packages.find]
include = ["bim_ingestion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]